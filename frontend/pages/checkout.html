<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finalizar pedido | Chup Chup Gourmet</title>

  <link rel="icon" href="../assets/images/logo.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/checkout.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <header class="checkout-header">
    <div class="container">
      <a href="../index.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        Voltar ao cardápio
      </a>
      <h1>Finalizar pedido</h1>
    </div>
  </header>

  <main class="container">
    <!-- Estado: carrinho vazio -->
    <div class="checkout-empty-notice state-panel" id="checkoutEmptyNotice" hidden>
      <div class="state-icon" aria-hidden="true">🛒</div>
      <h3>Seu carrinho está vazio</h3>
      <p>Volte ao cardápio para escolher seus produtos antes de finalizar o pedido.</p>
      <a href="../index.html" class="btn btn-primary mt-6">Ver cardápio</a>
    </div>

    <!-- Conteúdo do checkout -->
    <div class="checkout-layout" id="checkoutContent">
      <form id="checkoutForm" novalidate>
        <fieldset class="form-fieldset">
          <legend>Dados do cliente</legend>

          <div class="field" data-field="customerName">
            <label for="customerName">Nome completo</label>
            <input type="text" id="customerName" name="customerName" placeholder="Seu nome" required />
            <span class="error-msg"></span>
          </div>

        </fieldset>

        <fieldset class="form-fieldset">
          <legend>Endereço de entrega</legend>

          <div class="field" data-field="street">
            <label for="street">Endereço</label>
            <input type="text" id="street" name="street" placeholder="Rua, avenida..." required />
            <span class="error-msg"></span>
          </div>

          <div class="field-row">
            <div class="field" data-field="number">
              <label for="number">Número</label>
              <input type="text" id="number" name="number" placeholder="Nº" required />
              <span class="error-msg"></span>
            </div>
            <div class="field" data-field="complement">
              <label for="complement">Complemento</label>
              <input type="text" id="complement" name="complement" placeholder="Apto, bloco... (opcional)" />
              <span class="error-msg"></span>
            </div>
          </div>

          <div class="field-row">
            <div class="field" data-field="neighborhood">
              <label for="neighborhood">Bairro</label>
              <select id="neighborhood" name="neighborhood" required>
                <option value="">Selecione o bairro</option>
                <option value="Antonio Lopez">Antonio Lopez</option>
                <option value="Areal">Areal</option>
                <option value="Bugia">Bugia</option>
                <option value="Centro">Centro</option>
                <option value="Chácara do Atlântico">Chácara do Atlântico</option>
                <option value="Coabh">Coabh</option>
                <option value="Coabh 2">Coabh 2</option>
                <option value="Favica">Favica</option>
                <option value="Floresta">Floresta</option>
                <option value="Guaxindimba">Guaxindimba</option>
                <option value="Marcilio Dias 1">Marcilio Dias 1</option>
                <option value="Marcilio Dias 2">Marcilio Dias 2</option>
                <option value="Maria Manteiga">Maria Manteiga</option>
                <option value="Nossa Senhora Aparecida">Nossa Senhora Aparecida</option>
                <option value="Nova Bethânia">Nova Bethânia</option>
                <option value="Nova Esperança">Nova Esperança</option>
                <option value="Novo Horizonte">Novo Horizonte</option>
                <option value="Quilombo Novo">Quilombo Novo</option>
                <option value="Santana">Santana</option>
                <option value="Santiago">Santiago</option>
                <option value="Santo Amaro">Santo Amaro</option>
                <option value="São Jose">São Jose</option>
                <option value="Urbens">Urbens</option>
                <option value="Vila dos Pescadores">Vila dos Pescadores</option>
              </select>
              <span class="error-msg"></span>
            </div>
          </div>
        </fieldset>

        <fieldset class="form-fieldset">
          <legend>Pagamento</legend>
          <div class="payment-options" id="paymentOptions"></div>
        </fieldset>

        <fieldset class="form-fieldset">
          <legend>Observações</legend>
          <div class="field" data-field="notes">
            <label for="notes">Observação para localização</label>
            <textarea id="notes" name="notes" class="textarea-obs" placeholder="Informe um ponto de referência para facilitar a localização da entrega."></textarea>
            <span class="error-msg"></span>
          </div>
        </fieldset>

        <div class="submit-error" id="submitError" role="alert"></div>

        <button type="submit" class="btn btn-primary btn-block" id="submitOrderBtn">Finalizar pedido pelo WhatsApp</button>
      </form>

      <aside class="checkout-summary">
        <h2>Resumo do pedido</h2>
        <div id="summaryItems"></div>
        <div class="cart-summary-row mt-6">
          <span>Subtotal</span>
          <span id="summarySubtotal">R$ 0,00</span>
        </div>
        <div class="cart-summary-row">
          <span>Entrega</span>
          <span id="summaryDelivery">R$ 0,00</span>
        </div>
        <div class="cart-summary-row is-total">
          <span>Total</span>
          <span id="summaryTotal">R$ 0,00</span>
        </div>
      </aside>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/categories.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/checkout.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
