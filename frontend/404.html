<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada | Chup Chup Gourmet</title>
  <meta name="description" content="A página que você procura não foi encontrada." />

  <link rel="icon" href="/assets/images/logo.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/404.css" />
</head>
<body>
  <main class="not-found-page">
    <section class="not-found-card" aria-labelledby="not-found-title">
      <a class="not-found-brand" href="/" aria-label="Voltar para Chup Chup Gourmet">
        <span class="not-found-brand-seal">
          <img src="/assets/images/logo.jpg" alt="" />
        </span>
        <span>
          <strong>Chup Chup Gourmet</strong>
          <small>Cremosão do seu jeito</small>
        </span>
      </a>

      <div class="not-found-mark" aria-hidden="true">404</div>
      <p class="not-found-eyebrow">Ops, essa página derreteu</p>
      <h1 id="not-found-title">Página não encontrada</h1>
      <p class="not-found-description">
        O endereço acessado não existe ou foi removido. Volte ao cardápio para continuar seu pedido.
      </p>

      <div class="not-found-actions">
        <a href="/" class="btn btn-primary">Voltar ao cardápio</a>
        <button type="button" class="btn btn-outline" id="backButton">Voltar à página anterior</button>
      </div>
    </section>
  </main>

  <script>
    document.getElementById("backButton").addEventListener("click", function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "/";
      }
    });
  </script>
</body>
</html>
